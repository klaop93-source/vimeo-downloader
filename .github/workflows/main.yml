name: Build Authentic Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          pip install flet requests
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner zip unzip

      - name: Build Flet APK
        run: flet build apk --verbose

      - name: Inject FFmpeg (Direct ZIP Method)
        run: |
          # 1. Locate the compiled APK
          APK_PATH=$(find build/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found! Flet build failed."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          
          # 2. Delete old signatures to prepare for the injection
          zip -d "$APK_PATH" "META-INF/*" || true
          
          # 3. Download FFmpeg and place it in the correct Android architecture folder
          mkdir -p lib/arm64-v8a
          wget https://github.com/Khang-NT/ffmpeg-binary-android/releases/download/v4.4/ffmpeg-aarch64 -O lib/arm64-v8a/libffmpeg.so
          chmod +x lib/arm64-v8a/libffmpeg.so
          
          # 4. Inject the folder directly into the APK archive
          zip -ur "$APK_PATH" lib/
          cp "$APK_PATH" unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          zipalign -v -p 4 unsigned.apk aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android aligned.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: VimeoDownloader-App
          path: aligned.apk
          
