name: Build Authentic Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Tools
        run: |
          pip install flet requests
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner

      - name: Build Flet APK
        run: flet build apk --verbose

      - name: Inject FFmpeg
        run: |
          # Dynamically find the APK regardless of the repository name
          APK_PATH=$(find build -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          
          wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d "$APK_PATH" -o decoded_apk
          
          mkdir -p decoded_apk/lib/arm64-v8a
          wget https://github.com/Khang-NT/ffmpeg-binary-android/releases/download/v4.4/ffmpeg-aarch64
          mv ffmpeg-aarch64 decoded_apk/lib/arm64-v8a/libffmpeg.so
          chmod +x decoded_apk/lib/arm64-v8a/libffmpeg.so
          
          java -jar apktool.jar b decoded_apk -o unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          zipalign -v -p 4 unsigned.apk aligned.apk
          apksigner sign --ks debug.keystore --ks-pass pass:android aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VimeoDownloader-App
          path: aligned.apk
